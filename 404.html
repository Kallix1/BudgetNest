<!DOCTYPE html>
<html lang="bg">
<head>
<meta charset="UTF-8">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B1%3C/text%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Страницата не е намерена — BudgetNest</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@500;600;700&display=swap" rel="stylesheet">
<script>
  /* Прилагаме темата ПРЕДИ стиловете да се рендерират, за да няма
     "премигване". Същата логика като на index.html: първо запазеният
     избор на потребителя, иначе — настройката на системата. */
  (function () {
    var theme = null;
    try { theme = localStorage.getItem('budgetnest-theme'); } catch (e) {}
    if (!theme) {
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      theme = prefersDark ? 'dark' : 'light';
    }
    document.documentElement.setAttribute('data-theme', theme);
  })();
</script>
<link rel="stylesheet" href="css/tokens.css?v=20">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    font-family:var(--font-body); color:var(--text-primary); line-height:1.6;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  :focus-visible { outline:3px solid var(--focus-ring); outline-offset:3px; border-radius:8px; }
  .mark {
    width:68px; height:68px; border-radius:22px; margin-bottom:26px;
    display:flex; align-items:center; justify-content:center;
    background:var(--sun); box-shadow:0 5px 0 rgba(0,0,0,0.2);
    transform:rotate(-6deg);
  }
  .mark svg { stroke:#3A2A00; }
  .code {
    font-family:var(--font-display); font-weight:700; font-size:clamp(64px,14vw,112px);
    line-height:1; letter-spacing:-0.04em; margin-bottom:12px; color:var(--text-primary);
  }
  h1 { font-family:var(--font-display); font-weight:600; font-size:clamp(20px,3vw,26px); letter-spacing:-0.02em; margin-bottom:12px; }
  p { color:var(--text-secondary); max-width:420px; margin:0 auto 30px; font-size:16px; }
  .actions { display:flex; gap:14px; flex-wrap:wrap; justify-content:center; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; font-family:var(--font-body); font-weight:700; font-size:15px;
    padding:13px 26px; border-radius:var(--r-md); cursor:pointer; text-decoration:none;
    border:1.5px solid transparent; transition:transform 0.12s ease, box-shadow 0.12s ease, filter 0.2s ease;
  }
  .btn-primary { background:var(--sprout); color:var(--on-sprout); box-shadow:var(--btn-shadow); }
  .btn-primary:hover { filter:brightness(1.05); transform:translateY(-1px); }
  .btn-primary:active { transform:translateY(4px); box-shadow:none; }
  .btn-ghost { background:var(--bg-panel); color:var(--text-primary); border-color:var(--input-border); box-shadow:0 3px 0 var(--line-lip); }
  .btn-ghost:hover { border-color:var(--nest-green-mid); }
  .btn-ghost:active { transform:translateY(3px); box-shadow:none; }
</style>
</head>
<body>
  <div class="mark"><svg viewBox="0 0 24 24" width="34" height="34" fill="none" stroke="#ffffff" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11.5 12 4l9 7.5"></path><path d="M5.5 9.8V19a1.3 1.3 0 0 0 1.3 1.3h10.4A1.3 1.3 0 0 0 18.5 19V9.8"></path><path d="M9.2 19v-4.2c0-1.1.6-1.9 1.6-2.3.9-.3 1.6-1.1 1.6-2.1 0-1.2-1-2.1-2.1-1.9-.8.1-1.4.7-1.6 1.4"></path></svg></div>
  <div class="code">404</div>
  <h1 id="t-title">Тази страница я няма</h1>
  <p id="t-text">Изглежда сте попаднали на несъществуващ адрес. Да ви върнем при бюджета?</p>
  <div class="actions">
    <a href="dashboard.html" class="btn btn-primary" id="t-dash">Към таблото</a>
    <a href="index.html" class="btn btn-ghost" id="t-home">Начална страница</a>
  </div>
  <script>
    (function () {
      var lang = 'bg';
      try { lang = localStorage.getItem('budgetnest-lang') || 'bg'; } catch (e) {}
      if (lang !== 'en') return;
      document.documentElement.lang = 'en';
      document.title = 'Page not found — BudgetNest';
      document.getElementById('t-title').textContent = 'This page doesn’t exist';
      document.getElementById('t-text').textContent = 'Looks like you landed on an address that isn’t here. Shall we take you back to your budget?';
      document.getElementById('t-dash').textContent = 'Go to dashboard';
      document.getElementById('t-home').textContent = 'Home page';
    })();
  </script>
<script src="chatbot.js?v=1" defer></script>
</body>
</html>
